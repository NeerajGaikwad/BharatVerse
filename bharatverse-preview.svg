    <rect x="18" y="389" width="7" height="7" rx="4" fill="#d9e987"/><text x="37" y="399" fill="#eff1e5" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.7">01  /  HAMPI · KARNATAKA</text>
    <text x="293" y="399" fill="#a8b5aa" font-family="Arial,sans-serif" font-size="11">INTERACTIVE 3D</text>
  </g>
  <text x="1142" y="570" text-anchor="end" fill="#d9e987" opacity=".75" font-family="Georgia,serif" font-size="37">01</text>
</svg>
